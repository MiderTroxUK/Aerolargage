# Configuration du Monte Carlo de dispersion - cas de référence.
# Unités SI, angles en degrés. Repère : x = axe de vol de l'avion, y = à gauche, z = vers le haut.
# TOUTES les valeurs ci-dessous sont des HYPOTHÈSES de démonstration (aucune donnée réelle) :
# voir le journal de décisions pour leur justification et leur plage plausible.

[nominal]
m = 5000.0              # masse plateforme + charge [kg]
z0 = 400.0              # altitude de largage au-dessus du niveau de la mer [m]
z_sol = 0.0             # altitude du sol au-dessus du niveau de la mer [m]
V_avion = 65.0          # vitesse sol de l'avion à la sortie de rampe [m/s]
t_ouv = 2.0             # délai avant début du gonflement [s]
t_rempl = 3.0           # temps de remplissage [s]
cxs_charge = 3.0        # Cx.S plateforme seule [m²]
cxs_max = 1250.0        # Cx.S voilure(s) gonflée(s) [m²]
n = 2.0                 # exposant de la loi de gonflement [-]
w_ref = 5.0             # vent prévu à 10 m sol [m/s]
psi_from_deg = 0.0      # direction D'OÙ VIENT le vent, depuis +x vers +y [deg] (0 = vent de face)

[dispersion]
# Écarts-types d'une loi normale, sauf mention contraire.
x0 = 40.0               # erreur de point de largage dans l'axe (instant de largage) [m]
y0 = 15.0               # erreur de point de largage en travers (tenue de route) [m]
z0 = 10.0               # erreur d'altitude de largage [m]
V_avion = 2.0           # erreur de vitesse avion [m/s]
w_ref = 2.0             # erreur de prévision de la force du vent [m/s] (bornée à >= 0)
psi_from_deg = 20.0     # erreur de prévision de la direction du vent [deg]
cxs_max_rel = 0.05      # écart-type RELATIF sur Cx.S gonflé [-]
t_ouv = 0.3             # dispersion du délai d'ouverture [s]
t_ouv_min = 0.5         # borne basse [s]
t_rempl = 0.5           # dispersion du temps de remplissage [s]
t_rempl_min = 0.5       # borne basse [s]

[pannes]
p_non_ouverture = 0.01          # probabilité de non-ouverture (charge sous plateforme seule)
p_gonflement_partiel = 0.03     # probabilité de gonflement partiel
facteur_partiel_min = 0.4       # Cx.S obtenu = facteur x Cx.S gonflé, facteur ~ U[min, max]
facteur_partiel_max = 0.8

[monte_carlo]
n_tirages = 5000
graine = 1                      # graine du générateur aléatoire (reproductibilité)
probabilite_confinement = 0.99  # niveau du contour de confinement [-]
marge = 100.0                   # marge ajoutée autour du contour pour la zone de sauvegarde [m]
